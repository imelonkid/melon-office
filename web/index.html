<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'><rect x='3' y='5' width='28' height='21' rx='5' fill='none' stroke='%239fbdac' stroke-width='3'/><circle cx='12' cy='15' r='2' fill='%239fbdac'/><circle cx='22' cy='15' r='2' fill='%239fbdac'/><path d='M17 26v5m-6 0h12' stroke='%239fbdac' stroke-width='3'/></svg>">

<body>
  <div id="app">
    <header id="top">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
          <rect x="3" y="5" width="28" height="21" rx="5" fill="none" stroke="#9fbdac" stroke-width="3"/>

          <path d="M17 26v5m-6 0h12" stroke="#9fbdac" stroke-width="3" stroke-linecap="round"/>

        <div>
          <div class="brand-name" id="brand-name">甜瓜科技 · AI 事业部</div>
          <div class="brand-sub">B3 工区 · Claude Code 实时</div>
        </div>
      </div>
      <div class="chips">
        <div class="chip" id="live"><i></i><span id="live-text">连接中</span></div>
        <div class="chip">在岗 <b id="headcount">0 / 0</b></div>
        <div class="chip">今日交付 <b id="delivered">0</b></div>
        <div class="chip taxi" id="taxi">距打车报销 --:--</div>
      </div>
    </header>
    <main>
      <section id="stage-wrap">
        <div id="stage"></div>
        <div id="caption"></div>
      </section>
      <aside id="panel"></aside>
    </main>
  </div>
  <script type="module" src="./src/main.ts"></script>

</html>
